[project]
name = "comfyui-intothelatent-utils"
description = "ComfyUI utility nodes by Into The Latent."
version = "1.10.0"
license = { file = "LICENSE" }
# Keep in step with requirements.txt (tests/test_requirements.py checks both). No torch entry and no
# torch floors anywhere, and no URL / git dependencies: the Breeze TTS model code is vendored under
# vendor/breeze-tts because the Comfy registry scanner flags URL dependencies.
dependencies = [
    "pillow>=10.3.0",
    "transformers>=4.57,<6",
    "numpy>=1.25",
    "librosa>=0.10",
    "soundfile>=0.13",
    "huggingface_hub>=0.25",
]

[project.urls]
Repository = "https://github.com/Into-The-Latent/ComfyUI-IntoTheLatent-Utils"
#  Used by Comfy Registry https://comfyregistry.org

[tool.pytest.ini_options]
# The repo root doubles as the ComfyUI extension package (its own __init__.py does
# `from .nodes... import ...`). Without this, pytest's default collection wraps the repo root in
# a Package collector (any dir with __init__.py) and imports that __init__.py directly to set it
# up, which breaks: those relative imports need `comfy_api`, not installed in a bare test run.
# Capping confcutdir at tests/ keeps the repo root out of that collector chain (run pytest from
# the repo root, as documented, so this relative path resolves correctly).
addopts = "--confcutdir=tests"
testpaths = ["tests"]

[tool.comfy]
PublisherId = "intothelatent"
DisplayName = "ComfyUI-IntoTheLatent-Utils"
Icon = ""
